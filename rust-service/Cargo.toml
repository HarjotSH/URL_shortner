[package]
name = "shortener-rust-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shortener-rust-service"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.6.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pins to keep the build working on the Rust 1.75 toolchain (older crate
# versions avoid the newer `edition2024` Cargo feature, which this toolchain
# doesn't support).
[dependencies.indexmap]
version = "=2.2.6"

[dependencies.getrandom]
version = "=0.2.15"
